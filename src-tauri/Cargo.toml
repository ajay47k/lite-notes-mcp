[package]
name = "lite-notes"
version = "1.0.0"
description = "Always-on-top floating markdown notes widget, MCP-driven"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
window-vibrancy = "0.6"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
